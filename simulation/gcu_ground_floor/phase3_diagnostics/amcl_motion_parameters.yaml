amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    map_topic: /map
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_min_range: 0.15
    laser_max_range: 12.0
    laser_likelihood_max_dist: 2.0
    max_beams: 120
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    sigma_hit: 0.2
    z_hit: 0.9
    z_rand: 0.1
    do_beamskip: false
    update_min_d: 0.03
    update_min_a: 0.03
    resample_interval: 1
    tf_broadcast: true
    transform_tolerance: 0.2
    save_pose_rate: -1.0
    set_initial_pose: false
    always_reset_initial_pose: false
    initial_pose:
      x: -0.05864395131342248
      y: -12.960313240266368
      z: 0.0
      yaw: 0.0
