### ekf.yaml (The Fixed Version) ###
ekf_filter_node:
  ros__parameters:
    frequency: 30.0 #30 hz - 30 times per second
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    
    map_frame: map #The global coordinate frame of the environment map.
    odom_frame: odom #The local coordinate frame of the robot, tied to its wheels. The coordinate frame representing the starting position where the robot woke up.
    base_link_frame: base_footprint #The physical center of the robot, usually at the base of the mast.
    world_frame: odom

    # ODOMETRY (From Arduino)
    # 15 boolean (true/false) flags represents the 15 state variables
    # X, Y, Yaw, Roll, Pitch, Angular rates, linear acceleration
    # We set X, Y, and YAW to TRUE because we are sending Position.
    # Why the others are false: Wheels cannot fly (Z is false), they don't tilt sideways (Roll/Pitch are false)
    odom0: /odom_raw
    odom0_config: [true,  true,  false, # We want X, Y position (true , true)
                   false, false, true, # We want Yaw (rotation) (true)
                   false, false, false, # Velocities
                   false, false, false, # Accelarations
                   false, false, false] # Angular Velocities
    odom0_differential: false
    odom0_relative: false

    # IMU (DISABLED for now to prove wheels work)
    imu0: /imu_raw
    imu0_config: [false, false, false, 
                  false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_differential: false
    imu0_relative: true
